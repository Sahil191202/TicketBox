# Day 7 only — IP / default_server admin SPA (before DNS).
# Day 8 replaces this with hostname vhosts (admin.conf + enable-domain-nginx.sh).
#
#   sudo cp deploy/nginx/admin-ip.conf /etc/nginx/sites-available/ticketbox-admin
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo ln -sf /etc/nginx/sites-available/ticketbox-admin /etc/nginx/sites-enabled/ticketbox-admin
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/admin;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
