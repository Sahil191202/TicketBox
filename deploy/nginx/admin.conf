# Day 7 — enable this site after Day 6 upload works.
#
#   sudo cp deploy/nginx/admin.conf /etc/nginx/sites-available/ticketbox-admin
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo ln -sf /etc/nginx/sites-available/ticketbox-admin /etc/nginx/sites-enabled/ticketbox-admin
#   sudo nginx -t && sudo systemctl reload nginx
#
# Day 7 serves by public IP (default_server). Day 8+ add real hostnames.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/admin;
    index index.html;

    # Hashed Vite assets — long cache
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback — React Router
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Do not proxy API here — browser calls VITE_API_URL (EC2_IP:4000 on Day 7).
    # CORS is handled in Express, not nginx.
}
