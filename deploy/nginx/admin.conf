# Day 8+ — app.__DOMAIN__ → React admin dist
# Placeholders replaced by deploy/scripts/enable-domain-nginx.sh
# Prefer Backend/infra/nginx/admin.conf if using infra/scripts/07-*.sh

server {
    listen 80;
    listen [::]:80;
    server_name app.__DOMAIN__;

    root /var/www/admin;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
