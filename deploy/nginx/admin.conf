# Day 7 — enable this site after Day 6 upload works.
# sudo cp deploy/nginx/admin.conf /etc/nginx/sites-available/ticketbox-admin
# sudo ln -s /etc/nginx/sites-available/ticketbox-admin /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_EC2_PUBLIC_IP or use a server_name after Day 8 DNS.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_EC2_PUBLIC_IP app.yourdomain.com;

    root /var/www/admin;
    index index.html;

    # Hashed Vite assets — long cache
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback — React Router
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Do not proxy API here — browser calls VITE_API_URL (api host / :4000).
    # CORS is handled in Express (Ram), not nginx.
}
